(function() {
  const EVENTS = JSON.parse(document.getElementById('events-data').textContent);
  const TODAY = document.querySelector('meta[name="today"]').content; // YYYY-MM-DD

  // 状態
  let viewYear, viewMonth; // 1-indexed month
  let selectedId = null;

  // ユーティリティ
  function parseDate(s) {
    const [y, m, d] = s.split('-').map(Number);
    return new Date(Date.UTC(y, m - 1, d));
  }
  function fmtDate(d) {
    const y = d.getUTCFullYear();
    const m = String(d.getUTCMonth() + 1).padStart(2, '0');
    const day = String(d.getUTCDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  function fmtMD(s) {
    const [y, m, d] = s.split('-');
    return `${parseInt(m, 10)}/${parseInt(d, 10)}`;
  }
  function impLabel(k) { return {high:'高', mid:'中', low:'低'}[k] || k; }
  function eachDate(startStr, endStr, fn) {
    const start = parseDate(startStr);
    const end = parseDate(endStr);
    for (let d = new Date(start); d <= end; d.setUTCDate(d.getUTCDate() + 1)) {
      fn(fmtDate(d));
    }
  }
  function getEventsOnDate(dateStr) {
    return EVENTS.filter(ev => ev.start <= dateStr && dateStr <= ev.end);
  }

  function renderGrid(year, month) {
    document.getElementById('month-label').textContent = `${year}年${month}月`;

    const firstDay = new Date(Date.UTC(year, month - 1, 1));
    const lastDay  = new Date(Date.UTC(year, month, 0));
    const firstDow = firstDay.getUTCDay();
    const daysInMonth = lastDay.getUTCDate();

    const body = document.getElementById('grid-body');
    body.innerHTML = '';

    let row = document.createElement('tr');
    for (let i = 0; i < firstDow; i++) {
      const td = document.createElement('td');
      td.className = 'other-month';
      row.appendChild(td);
    }
    let dow = firstDow;
    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const td = document.createElement('td');
      const classes = [];
      if (dow === 0) classes.push('sun');
      if (dow === 6) classes.push('sat');
      if (dateStr === TODAY) classes.push('today');
      else if (dateStr < TODAY) classes.push('past');
      td.className = classes.join(' ');

      const numSpan = document.createElement('span');
      numSpan.className = 'day-num';
      numSpan.textContent = day;
      td.appendChild(numSpan);

      const evs = getEventsOnDate(dateStr);
      for (const ev of evs) {
        const span = document.createElement('span');
        const evClasses = ['ev', `imp-${ev.importance}`];
        if (ev.start !== ev.end) {
          if (dateStr === ev.start) evClasses.push('range-start');
          else if (dateStr === ev.end) evClasses.push('range-end');
          else evClasses.push('range-mid');
        }
        if (ev.tentative) evClasses.push('tentative');
        if (ev.id === selectedId) evClasses.push('selected');
        span.className = evClasses.join(' ');
        span.textContent = ev.title;
        span.title = (ev.tentative ? `[日付未確定・${ev.tentativeNote || '仮配置'}] ` : '') + ev.title + ': ' + ev.body;
        span.dataset.id = ev.id;
        span.addEventListener('click', () => selectEvent(ev.id));
        td.appendChild(span);
      }
      row.appendChild(td);

      dow = (dow + 1) % 7;
      if (dow === 0 && day < daysInMonth) {
        body.appendChild(row);
        row = document.createElement('tr');
      }
    }
    while (dow !== 0 && dow < 7) {
      const td = document.createElement('td');
      td.className = 'other-month';
      row.appendChild(td);
      dow++;
      if (dow >= 7) break;
    }
    body.appendChild(row);

    renderPeek(year, month);
  }

  function renderPeek(year, month) {
    const peek = document.getElementById('peek');
    peek.innerHTML = '';

    function monthRange(y, m) {
      const start = `${y}-${String(m).padStart(2,'0')}-01`;
      const lastDay = new Date(Date.UTC(y, m, 0)).getUTCDate();
      const end   = `${y}-${String(m).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
      return [start, end];
    }
    function countInMonth(y, m) {
      const [s, e] = monthRange(y, m);
      return EVENTS.filter(ev => !(ev.end < s || ev.start > e)).length;
    }

    const prev = { y: year, m: month - 1 };
    if (prev.m === 0) { prev.m = 12; prev.y--; }
    const next = { y: year, m: month + 1 };
    if (next.m === 13) { next.m = 1; next.y++; }

    const prevN = countInMonth(prev.y, prev.m);
    const nextN = countInMonth(next.y, next.m);

    if (prevN > 0) {
      const a = document.createElement('span');
      a.className = 'peek-pill';
      a.textContent = `← ${prev.m}月 ${prevN}件`;
      a.addEventListener('click', () => { viewYear = prev.y; viewMonth = prev.m; renderGrid(viewYear, viewMonth); });
      peek.appendChild(a);
    }
    if (nextN > 0) {
      const a = document.createElement('span');
      a.className = 'peek-pill';
      a.textContent = `${next.m}月 ${nextN}件 →`;
      a.addEventListener('click', () => { viewYear = next.y; viewMonth = next.m; renderGrid(viewYear, viewMonth); });
      peek.appendChild(a);
    }
  }

  function selectEvent(id) {
    selectedId = id;
    document.querySelectorAll('.ev').forEach(el => el.classList.toggle('selected', el.dataset.id === id));
    const ev = EVENTS.find(e => e.id === id);
    const side = document.getElementById('side-body');
    if (!ev) { side.innerHTML = '<p class="empty">イベントが見つかりません。</p>'; return; }

    const dateStr = ev.start === ev.end ? fmtMD(ev.start) : `${fmtMD(ev.start)} 〜 ${fmtMD(ev.end)}`;
    const fullDateStr = ev.start === ev.end ? ev.start : `${ev.start} 〜 ${ev.end}`;
    const themes = ev.themes.map(t => `<span class="theme-tag">${escapeHtml(t)}</span>`).join('');
    const tentativeBadge = ev.tentative ? `<span class="badge-tentative">仮配置: ${escapeHtml(ev.tentativeNote || '日付未確定')}</span>` : '';

    side.innerHTML = `
      <div class="panel-date">${escapeHtml(fullDateStr)} <span style="color:#aaa;">(${escapeHtml(dateStr)})</span></div>
      <div class="panel-title">${escapeHtml(ev.title)}</div>
      <div class="panel-meta">
        <span class="imp imp-${ev.importance}">重要度: ${impLabel(ev.importance)}</span>
        ${tentativeBadge}
      </div>
      <div class="panel-meta">${themes}</div>
      <div class="panel-body">${escapeHtml(ev.body)}</div>
    `;
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderFullList() {
    const tbody = document.getElementById('full-list-body');
    tbody.innerHTML = '';
    const sorted = [...EVENTS].sort((a, b) => a.start.localeCompare(b.start) || a.title.localeCompare(b.title));
    for (const ev of sorted) {
      const tr = document.createElement('tr');
      const dateCell = ev.start === ev.end ? ev.start : `${ev.start} 〜 ${ev.end}`;
      const tentativeNote = ev.tentative ? ` <em style="color:#888;font-size:0.85em;">(仮: ${escapeHtml(fmtMD(ev.start))})</em>` : '';
      const themes = ev.themes.map(t => `<span class="theme-tag">${escapeHtml(t)}</span>`).join('');
      tr.innerHTML = `
        <td class="cal-date">${escapeHtml(dateCell)}${tentativeNote}</td>
        <td class="cal-title">${escapeHtml(ev.title)}</td>
        <td>${escapeHtml(ev.body)}${ev.tentative ? ` <em>※ 日付未確定・${escapeHtml(ev.tentativeNote || '')}</em>` : ''}</td>
        <td><span class="imp imp-${ev.importance}">${impLabel(ev.importance)}</span></td>
        <td>${themes}</td>
      `;
      tbody.appendChild(tr);
    }
  }

  function init() {
    const [ty, tm] = TODAY.split('-').map(Number);
    viewYear = ty;
    viewMonth = tm;
    renderGrid(viewYear, viewMonth);
    renderFullList();

    document.getElementById('prev-btn').addEventListener('click', () => {
      viewMonth--;
      if (viewMonth < 1) { viewMonth = 12; viewYear--; }
      renderGrid(viewYear, viewMonth);
    });
    document.getElementById('next-btn').addEventListener('click', () => {
      viewMonth++;
      if (viewMonth > 12) { viewMonth = 1; viewYear++; }
      renderGrid(viewYear, viewMonth);
    });
    document.getElementById('today-btn').addEventListener('click', () => {
      viewYear = ty;
      viewMonth = tm;
      renderGrid(viewYear, viewMonth);
    });

    const todayEvs = getEventsOnDate(TODAY);
    if (todayEvs.length > 0) selectEvent(todayEvs[0].id);
  }

  init();
})();
</script>

</body>
</html>
