{# issue #480: 感情スコア (自己申告 7段階) の入力欄。表示は _summary_inputs.html #}
<form id="emotion-form" class="margin-form" method="post" action="{{ url_for('portfolio.save_emotion_score') }}" hidden>
  <input type="hidden" name="return_query" value="{{ return_query }}">
  <div class="margin-form-row"><label>一言 (任意) <input type="text" name="note" maxlength="200"></label></div>
  {%- for s, name, hint in emotion_choices %}
  <div class="emotion-choice">
    <button type="submit" name="score" value="{{ s }}">{{ '%+d'|format(s) if s else '0' }} {{ name }}</button>
    <span class="margin-form-note">{{ hint }}</span>
  </div>
  {%- endfor %}
  <div class="margin-form-note">感情と逆向きに目標が動きます (恐怖で張り、熱狂で落とす)。入力から5営業日で期限切れになり、中立として扱います。</div>
</form>
